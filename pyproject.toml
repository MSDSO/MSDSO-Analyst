[project]
name = "msdso-analyst"
version = "2.0.0"
description = "r/MSDSO community Discord bot."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "disnake==2.12.2",
    "python-dotenv>=1.0",
]

[project.scripts]
msdso-analyst = "msdso_analyst.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["msdso_analyst", "tests"]
